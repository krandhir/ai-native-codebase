spring:
  application:
    name: modular-monolith-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/assignment_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
